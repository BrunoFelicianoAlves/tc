    const grade = document.getElementById("grade-produtos");
    const pillsWrap = document.getElementById("categorias-pill");
    const estadoVazio = document.getElementById("estado-vazio");
    const contador = document.getElementById("contador-resultados");
    const campoBusca = document.getElementById("campo-busca");
    const formBusca = document.getElementById("form-busca");

    let categoriaAtiva = "Todos";

    function montarPills() {
        const categorias = ["Todos", ...new Set(PRODUTOS.map(p => p.categoria))];
        pillsWrap.innerHTML = categorias.map(cat =>
            `<button type="button" data-categoria="${cat}" class="${cat === categoriaAtiva ? "active" : ""}">${cat}</button>`
        ).join("");

        pillsWrap.querySelectorAll("button").forEach(btn => {
            btn.addEventListener("click", () => {
                categoriaAtiva = btn.getAttribute("data-categoria");
                pillsWrap.querySelectorAll("button").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                renderizar();
            });
        });
    }

    function cardHTML(p) {
        const alvo = p.link.startsWith("http") ? ' target="_blank" rel="noopener sponsored"' : "";
        const badge = p.badge ? `<span class="badge">${p.badge}</span>` : "";
        return `
            <div class="card">
                ${badge}
                <a href="${p.link}"${alvo}>
                    <img src="${p.imagem}" alt="Produto" loading="lazy">
                    <h3>${p.nome}</h3>
                </a>
            </div>`;
    }

    function renderizar() {
        const termo = campoBusca.value.trim().toLowerCase();

        const filtrados = PRODUTOS.filter(p => {
            const passaCategoria = categoriaAtiva === "Todos" || p.categoria === categoriaAtiva;
            const passaBusca = !termo || p.nome.toLowerCase().includes(termo);
            return passaCategoria && passaBusca;
        });

        grade.innerHTML = filtrados.map(cardHTML).join("");
        estadoVazio.style.display = filtrados.length === 0 ? "block" : "none";
        contador.textContent = `${filtrados.length} produto${filtrados.length === 1 ? "" : "s"} encontrado${filtrados.length === 1 ? "" : "s"}`;
    }

    formBusca.addEventListener("submit", (e) => {
        e.preventDefault();
        renderizar();
    });
    campoBusca.addEventListener("input", renderizar);

    // Se veio de /produtos.html?q=algo (busca feita na home)
    const parametros = new URLSearchParams(window.location.search);
    if (parametros.get("q")) {
        campoBusca.value = parametros.get("q");
    }

    montarPills();
    renderizar();
    </script>
